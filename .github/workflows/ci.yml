name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Throwaway values for the ephemeral containers in this run only.
  JWT_SECRET: ci-only-secret-that-is-definitely-long-enough-1234
  DATABASE_URL: postgresql+psycopg://serviceflow:serviceflow@127.0.0.1:5433/serviceflow
  REDIS_URL: redis://127.0.0.1:6380/0
  S3_ENDPOINT_URL: http://127.0.0.1:9000
  S3_BUCKET: serviceflow-media
  S3_REGION: us-east-1
  AWS_ACCESS_KEY_ID: serviceflow
  AWS_SECRET_ACCESS_KEY: serviceflow-dev-secret
  SMTP_HOST: 127.0.0.1
  SMTP_PORT: "1025"

jobs:
  api:
    name: API - lint, types, migrations, tests (PostgreSQL 16)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 3s --health-timeout 3s --health-retries 30
      redis:
        image: redis:7-alpine
        ports: ["6380:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 3s --health-timeout 3s --health-retries 30
    steps:
      - uses: actions/checkout@v4

      # The application role must not be a superuser: superusers bypass row
      # level security, and tests/test_row_level_security.py fails if it is one.
      - name: Create the non-superuser application role
        run: |
          PGPASSWORD=postgres psql -h 127.0.0.1 -p 5433 -U postgres -v ON_ERROR_STOP=1 \
            -f docker/postgres/init.sql

      # MinIO and Mailpit need a command, which a services block cannot set. The
      # suite genuinely uploads to MinIO and reads mail out of Mailpit.
      - name: Start object storage and mail capture
        run: |
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER=serviceflow -e MINIO_ROOT_PASSWORD=serviceflow-dev-secret \
            quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z server /data
          docker run -d --name mailpit -p 1025:1025 -p 8025:8025 axllent/mailpit:latest
          for _ in $(seq 1 40); do
            curl -sf http://127.0.0.1:9000/minio/health/live >/dev/null \
              && curl -sf http://127.0.0.1:8025/api/v1/info >/dev/null && exit 0
            sleep 2
          done
          docker logs minio; docker logs mailpit; exit 1

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: apps/api/uv.lock
      - name: Install
        working-directory: apps/api
        run: uv sync --extra dev --frozen

      - name: Lint and format
        working-directory: apps/api
        run: |
          uv run ruff check . ../../benchmarks
          uv run ruff format --check .
      - name: Typecheck
        working-directory: apps/api
        run: uv run mypy src
      - name: Migrations apply and match the models
        working-directory: apps/api
        run: |
          uv run alembic upgrade head
          uv run alembic check
      - name: Tests (unit, integration, tenant isolation, concurrency, Celery)
        working-directory: apps/api
        run: uv run pytest
      - name: Demo seed runs cleanly on the migrated database
        working-directory: apps/api
        run: uv run python -m serviceflow.db.seed | tail -3

  isolation-benchmark:
    name: Tenant isolation benchmark
    runs-on: ubuntu-latest
    needs: api
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 3s --health-timeout 3s --health-retries 30
      redis:
        image: redis:7-alpine
        ports: ["6380:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 3s --health-timeout 3s --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - name: Create the non-superuser application role
        run: PGPASSWORD=postgres psql -h 127.0.0.1 -p 5433 -U postgres -v ON_ERROR_STOP=1 -f docker/postgres/init.sql
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: apps/api/uv.lock
      - working-directory: apps/api
        run: uv sync --extra dev --frozen
      # Re-measured on every push; the run fails on any unexpected success, server
      # error, invariant violation or failed control write. The committed result in
      # benchmarks/results/ is not overwritten here.
      - name: Run the benchmark
        env:
          OUTPUT: ${{ runner.temp }}/tenant_isolation.json
        run: ./scripts/bench-isolation.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tenant-isolation-ci
          path: ${{ runner.temp }}/tenant_isolation.json
          retention-days: 14

  web:
    name: Web - lint, types, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - name: Lint
        run: npx eslint src e2e
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Build
        run: npm run build

  docker-smoke:
    name: Docker Compose - fresh stack smoke test
    runs-on: ubuntu-latest
    needs: [api, web]
    steps:
      - uses: actions/checkout@v4
      # Every service, including the one-shot migrate, minio-init and seed
      # containers - naming only the long-running ones would skip the seed.
      - name: Build and start the whole stack
        run: docker compose up --build -d
      - name: Wait for the one-shot setup containers
        run: |
          # Poll until each has exited: a running container also reports exit code 0.
          for service in migrate minio-init seed; do
            for _ in $(seq 1 120); do
              [ "$(docker compose ps -a --format '{{.State}}' "$service")" = "exited" ] && break
              sleep 5
            done
            code="$(docker compose ps -a --format '{{.ExitCode}}' "$service")"
            echo "$service exited with $code"
            [ "$code" = "0" ] || { docker compose logs "$service"; exit 1; }
          done
      - name: Smoke test
        run: ./scripts/docker-smoke.sh
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install Playwright
        working-directory: apps/web
        run: |
          npm ci
          npx playwright install --with-deps chromium
      # e2e.sh clears the sign-in limiter's counters (the smoke test just used
      # some of the budget) and runs the suite; the limiter stays enabled.
      - name: Browser end-to-end tests
        run: ./scripts/e2e.sh
        env:
          E2E_BASE_URL: http://localhost:3000
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results
          path: apps/web/test-results
          retention-days: 7
      - name: Logs on failure
        if: failure()
        run: docker compose logs --tail 200
      - name: Stop
        if: always()
        run: docker compose down -v
